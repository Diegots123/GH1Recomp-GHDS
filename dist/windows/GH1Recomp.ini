# Configuracoes do GH1 Recomp. Linhas "chave = valor"; # comeca um comentario.

# Resolucao interna, em multiplos da do PS2 (1 a 8). A imagem continua 4:3.
upscale = 3

# Abrir em tela cheia sem bordas (F11 ou Alt+Enter alterna a qualquer momento).
fullscreen = 0

# Tamanho da janela fora da tela cheia.
window = 1280x960

# Esperar o monitor para mostrar cada quadro (menos tearing, um pouco mais de atraso).
vsync = 0

# hw: renderizador OpenGL do PCSX2 (padrao). sw: renderizador em software do PCSX2.
renderer = hw

# ---------------- Teclado ----------------
# (a tela do F1 no menu principal muda tudo daqui para baixo)
# O teclado comeca ligado se nenhum controle ou guitarra estiver conectado
# ao abrir o jogo, e desligado se houver um; o F1 liga e desliga depois.
#   keyboard_mode = strum  : segure o traste e palhete (o jogo ve uma guitarra)
#   keyboard_mode = nostrum: sem palhetar, como o GH1 joga com o DualShock 2
keyboard_mode = strum

# Uma tecla por acao, sem tecla repetida na mesma secao. Nomes das teclas
# como o SDL os escreve: 1, A, F2, Up, Down, Left, Right, Return, Space,
# Backspace, Tab, Left Shift, Right Shift, Left Ctrl, ... (none: nenhuma).
# F1, F11 e Escape sao reservadas. Nos menus valem as teclas de [keys.menu];
# na musica, as do modo escolhido.
[keys.strum]
green = 1
red = 2
yellow = 3
blue = 4
orange = 5
strum_up = Up
strum_down = Down
start = Return
star_power = Backspace
whammy = Right Shift

[keys.nostrum]
green = 1
red = 2
yellow = 3
blue = 4
orange = 5
start = Return
star_power = Backspace
whammy = Right Shift

[keys.menu]
up = Up
down = Down
left = Left
right = Right
confirm = Return
back = Backspace
start = Space
